[package]
name = "rc-ui"
description = "RabbitControl Windows desktop app (native XAML Islands)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rabbitcontrol-win"
path = "src/main.rs"

[dependencies]
rc-platform-win = { path = "../rc-platform-win" }
ironrdp-displaycontrol = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde.workspace = true
winreg = "0.55"
# 0.37 is the last windows-rs release with the inbox Windows.UI.Xaml projections.
windows = { version = "0.37", features = [
    "alloc", "Foundation", "System", "UI_Xaml_Controls_Primitives", "UI_Xaml_Hosting", "UI_Xaml_Markup", "UI_Xaml_Input",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_System_WinRT_Xaml", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "UI_Input", "UI_Xaml_Automation",
] }
