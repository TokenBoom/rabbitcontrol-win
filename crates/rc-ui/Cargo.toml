[package]
name = "rc-ui"
description = "RabbitControl Windows desktop app (native XAML Islands)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "rabbitcontrol-win"
path = "src/main.rs"

[build-dependencies]
# exe 资源嵌入（图标）：自动查找 rc.exe / windres
embed-resource = "2.5"

[dependencies]
rc-platform-win = { path = "../rc-platform-win" }
rc-d3d11 = { path = "../rc-d3d11" }
rc-client-core.workspace = true
rc-session.workspace = true
rc-tools.workspace = true
rc-input.workspace = true
rc-types.workspace = true
serde.workspace = true
serde_json.workspace = true
# 0.37 is the last windows-rs release with the inbox Windows.UI.Xaml projections.
# 会话渲染表面（SharedDevice DXGI / ISwapChainPanelNative）走 0.58 世界，与 0.37 并存
windows58 = { package = "windows", version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
windows = { version = "0.37", features = [
    "alloc", "ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Storage_Streams", "System", "UI_Composition", "UI_ViewManagement", "UI_Xaml_Controls_Primitives", "UI_Xaml_Hosting", "UI_Xaml_Markup", "UI_Xaml_Input", "UI_Xaml_Media", "UI_Xaml_Media_Imaging", "UI_Xaml_Shapes",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_WinRT_Xaml", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
    "UI_Input", "UI_Xaml_Automation",
] }
