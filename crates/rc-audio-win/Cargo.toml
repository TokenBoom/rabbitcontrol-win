[package]
name = "rc-audio-win"
description = "RabbitControl Windows audio backend (WASAPI loopback capture and playback)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rc-audio.workspace = true
rc-types.workspace = true
rc-win32core = { path = "../rc-win32core" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
] }
