[package]
name = "rc-clipboard-win"
description = "RabbitControl Windows clipboard backend (Win32 clipboard)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rc-session.workspace = true
rc-types.workspace = true
rc-win32core = { path = "../rc-win32core" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
