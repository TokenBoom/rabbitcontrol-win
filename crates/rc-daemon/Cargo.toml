[package]
name = "rc-daemon"
description = "RabbitControl Windows background service (host agent daemon)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rc-daemon"
path = "src/main.rs"

[dependencies]
rc-input.workspace = true
rc-input-win = { path = "../rc-input-win" }
rc-platform-win = { path = "../rc-platform-win" }
rc-types.workspace = true
serde.workspace = true
serde_json.workspace = true
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Variant",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_Security",
] }
