[package]
name = "rc-appcore"
description = "RabbitControl Windows shared app logic (signal runtime, host orchestration, agent IPC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
rc-client-core.workspace = true
rc-session.workspace = true
serde.workspace = true
serde_json.workspace = true
# 客户端安全锁定的密钥校验：PBKDF2-HMAC-SHA256 + 随机盐
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
getrandom = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "std",
] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
] }
