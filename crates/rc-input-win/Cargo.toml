[package]
name = "rc-input-win"
description = "RabbitControl Windows input injection and capture (SendInput / low-level hooks)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rc-input.workspace = true
rc-types.workspace = true
rc-win32core = { path = "../rc-win32core" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
