[package]
name = "rc-win32core"
description = "RabbitControl Windows fundamentals: COM apartments, message pump, MMCSS thread QoS, power requests, QPC host clock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rc-types.workspace = true
# 比工作区清单多要三个命名空间：电源请求与电源通知（Power）、锁屏查询（RemoteDesktop）、
# REASON_CONTEXT（Threading）。工作区清单里的 feature 不会自动并入，原有用到的要一并列出。
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
