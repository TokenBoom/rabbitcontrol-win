# M6 发布流水线：v* tag 触发，windows-latest 构建 --locked --release
# 并上传 zip 到 GitHub Release（客户端后续可做 release 更新检测）。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build (locked release)
        run: cargo build --locked --release -p rc-ui
        shell: pwsh

      - name: Stage dist
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $stage = "rabbitcontrol-win-$tag"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/rabbitcontrol-win.exe $stage
          if (Test-Path README.md) { Copy-Item README.md $stage }
          if (Test-Path LICENSE) { Copy-Item LICENSE $stage }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Write-Host "staged $stage.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rabbitcontrol-win-*.zip
          generate_release_notes: true
